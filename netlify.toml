# Hébergement Netlify : le formulaire de tournage y fonctionne sans serveur (Netlify Forms),
# et les demandes arrivent par courriel au compte qui gère le site.
[build]
  command = "npm run build"
  publish = "."

# script-src : en plus de nos fichiers, l'empreinte du script du badge que Netlify ajoute aux sites en formule gratuite
# (obligatoire sur cette formule). Si Netlify change son badge, la console signalera une nouvelle empreinte : la mettre ici.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-BkKP2XO6WOEc3kXOiLr2ZoY83hamalKjPY9xBcbXVuw='; font-src 'self'; connect-src 'self'; form-action 'self' mailto:; frame-ancestors 'self'; base-uri 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
